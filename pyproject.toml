[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "real-embodied2code"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
collision = ["python-fcl>=0.7","rtree>=1.3"]
test = ["pytest>=8"]

[project.scripts]
real-embodied2code = "real_robot.__main__:main"

[project.entry-points."pyrualean.robots"]
physical = "real_robot.robot:ADAPTER"

[tool.setuptools.packages.find]
include = ["real_robot*", "codeworld*", "pyrualean*"]
namespaces = false
[tool.setuptools.package-data]
codeworld = ["resources/**/*","resources/*"]
pyrualean = ["knowledge/*.md","*.json","resources/*","resources/**/*"]
real_robot = ["data/**/*","knowledge/*.md","PIPER.zh-CN.md"]
[tool.ruff]
line-length = 100

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.exclude-package-data]
"*" = ["**/*.pyc", "**/__pycache__/*", "**/.DS_Store"]
